name = "raspberry_pi5_hello"
description = "Hello world app for RaspberryPI 5"
version = "0.1.0-dev"

authors = ["J. German Rivera"]
maintainers = ["J. German Rivera <jgrivera67@gmail.com>"]
maintainers-logins = ["jgrivera67"]

executables = ["raspberry_pi5_hello"]

[[depends-on]]
hirtos = "*"
gnat_aarch65_elf = "*"
gnatprove = "*"
#gprbuild = "^22" # needed by alire-index CI builds
gprbuild = "*" # needed by alire-index CI builds

[configuration.values]
hirtos.Platform = "raspberry_pi5"

[[pins]]
hirtos = { path='../..' }

[gpr-set-externals]
CPU_Core = "arm_cortex_a76"

[build-profiles]
hirtos = "development"

[[actions]]
[actions.'case(os)'.windows]
[actions.'case(os)'.'...']
type = "post-build"
command = ["sh", "-c", "aarch64-elf-objdump -dSstl bin/raspberry_pi5_hello.elf > bin/raspberry_pi5_hello.lst; aarch64-elf-objcopy -O binary bin/raspberry_pi5_hello.elf bin/raspberry_pi5_hello.bin"]
